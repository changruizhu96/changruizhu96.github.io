name: Sync publications

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-publications.yml"
      - "scripts/sync-publications.mjs"
      - "src/lib/publications.mjs"
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publication-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Fetch publication metadata
        run: npm run sync:publications
      - name: Commit changed publication data
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/auto-publications.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/auto-publications.json
          git commit -m "Update publication metadata"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy changed publication data
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
